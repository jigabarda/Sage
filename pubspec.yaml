name: sage
description: "Sage — offline-first migraine and reflux companion (local SQLite)."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  intl: ^0.19.0
  path: ^1.9.0
  path_provider: ^2.1.5
  shared_preferences: ^2.3.3
  sqflite: ^2.4.1
  # Scheduled on-device notifications. No FCM, no push infrastructure, no
  # server - the whole point is that a reminder about your own log never
  # leaves the device.
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.0
  flutter_timezone: ^4.1.0
  # Hands the export to whatever the user picks - email, a messaging app, a
  # file manager. The app never sends anything itself and has no permission
  # to; the share sheet is the user doing it deliberately.
  share_plus: ^13.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Drives the migration test against a real temp file on the desktop VM.
  # The pragma sequence in SageDatabase.openOptions() is the safety mechanism,
  # and it can only be exercised through a real open — see the guide.
  sqflite_common_ffi: ^2.4.0+3

flutter:
  uses-material-design: true
  # No `assets:` or `fonts:` yet. Bundled type (Sellora ships Plus Jakarta Sans
  # and Inter) is deferred until there are screens to set it on; Phase 0 uses
  # the platform font so the build has no binary assets to carry.
